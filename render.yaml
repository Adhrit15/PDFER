# One-click free hosting on Render: https://render.com/deploy?repo=https://github.com/Adhrit15/PDFER
services:
  - type: web
    name: pdfer
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      # Both values are entered in the Render dashboard and never stored in the repo.
      - key: GEMINI_API_KEY
        sync: false
      # Postgres connection string from a free Neon project (neon.tech), which does not expire.
      - key: DATABASE_URL
        sync: false
