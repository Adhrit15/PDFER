# One-click free hosting on Render: https://render.com/deploy?repo=https://github.com/Adhrit15/PDFER
services:
  - type: web
    name: pdfer
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Render asks for this when you deploy; it is never stored in the repo
      - key: DATABASE_URL
        fromDatabase:
          name: pdfer-db
          property: connectionString

databases:
  - name: pdfer-db
    plan: free
